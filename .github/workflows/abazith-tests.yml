name: Abazith parser tests

on:
  push:
    branches: ["main", "feat/abazith-v0.1-parser-conformance"]
  pull_request:

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run parser conformance suite
        run: python -m unittest discover -s tests -v
